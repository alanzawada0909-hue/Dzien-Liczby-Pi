<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Głosowanie Dzień Pi - XX LO</title>
    
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-purple: #6c5ce7;
            --dark-bg: #050a18;
            --glass: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--dark-bg);
            background-image: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: white;
            margin: 0;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .pi-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: -1;
            font-size: 2rem;
            color: rgba(0, 210, 255, 0.05);
        }

        header {
            text-align: center;
            padding: 30px 20px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 2px solid var(--neon-purple);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            font-size: 1.8rem;
            text-shadow: 0 0 10px var(--neon-blue);
        }

        .school-tag {
            color: var(--neon-blue);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.8rem;
            margin-bottom: 5px;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        #reader {
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            border: none !important;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        th {
            background: var(--neon-purple);
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
        }

        tr.winner {
            background: rgba(0, 210, 255, 0.2);
            font-weight: bold;
            box-shadow: inset 4px 0 0 var(--neon-blue);
        }

        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: none;
            animation: fadeIn 0.5s;
        }
        .alert-success { background: rgba(46, 204, 113, 0.3); border: 1px solid #2ecc71; color: #2ecc71; }
        .alert-error { background: rgba(231, 76, 60, 0.3); border: 1px solid #e74c3c; color: #e74c3c; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .stats-summary {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: bold;
            color: var(--neon-blue);
        }
    </style>
</head>
<body>

    <div class="pi-bg" id="pi-bg"></div>

    <header>
        <div class="school-tag">XX Liceum Ogólnokształcące</div>
        <h1>𝜋 DZIEŃ LICZBY PI 2026 𝜋</h1>
    </header>

    <div class="container">
        <div id="status-msg" class="alert"></div>

        <div class="card" id="scanner-card">
            <h3 style="margin-top:0"><span id="user-status">📷 Zeskanuj kod stacji</span></h3>
            <div id="reader"></div>
        </div>

        <div class="card">
            <div class="stats-summary">
                <span>RANKING STACJI (NA ŻYWO)</span>
                <span id="total-votes-display">Suma głosów: ...</span>
            </div>
            <table id="results-table">
                <thead>
                    <tr>
                        <th>STACJA</th>
                        <th>GŁOSY</th>
                        <th>UDZIAŁ</th>
                    </tr>
                </thead>
                <tbody id="results-body">
                    <tr><td colspan="3" style="text-align:center">Ładowanie wyników...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // --- KONFIGURACJA ---
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxEwD-ytntDUxYo0WlvJYl3Ld6p1_6A-3juWwe1q4vKhnvtZq_RzaiqUKUqKVYMMb8/exec";
        
        // --- INICJALIZACJA TŁA ---
        const bg = document.getElementById('pi-bg');
        for(let i=0; i<30; i++) {
            const pi = document.createElement('div');
            pi.innerText = 'π';
            pi.style.position = 'absolute';
            pi.style.left = Math.random() * 100 + 'vw';
            pi.style.top = Math.random() * 100 + 'vh';
            pi.style.opacity = Math.random() * 0.1;
            bg.appendChild(pi);
        }

        // --- LOGIKA GŁOSOWANIA ---
        
        checkExistingVote();
        fetchResults();
        setInterval(fetchResults, 5000); // Odświeżaj co 5 sekund

        function checkExistingVote() {
            if (localStorage.getItem('user_has_voted')) {
                document.getElementById('user-status').innerHTML = "🔒 Głos oddany";
                document.getElementById('reader').innerHTML = "<div style='text-align:center; padding:20px;'>Dziękujemy! Twoje punkty zostały doliczone.</div>";
                return true;
            }
            return false;
        }

        async function registerVote(stationId) {
            if (checkExistingVote()) return;

            showStatus("⏳ Zapisywanie głosu...", "success");

            try {
                const response = await fetch(`${SCRIPT_URL}?action=vote&id=${stationId}`);
                if (response.ok) {
                    localStorage.setItem('user_has_voted', 'true');
                    showStatus(`✅ Oddano głos na stację ${stationId}!`, "success");
                    checkExistingVote();
                    fetchResults();
                }
            } catch (error) {
                showStatus("⚠️ Błąd połączenia. Spróbuj jeszcze raz.", "error");
            }
        }

        async function fetchResults() {
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getResults`);
                const data = await response.json();
                updateUI(data);
            } catch (error) {
                console.error("Błąd pobierania danych");
            }
        }

        function updateUI(data) {
            const tbody = document.getElementById('results-body');
            const totalDisplay = document.getElementById('total-votes-display');
            
            let totalVotes = data.reduce((sum, row) => sum + parseInt(row[1] || 0), 0);
            totalDisplay.innerText = `Suma głosów: ${totalVotes}`;

            let sortedData = [...data].sort((a, b) => b[1] - a[1]);
            tbody.innerHTML = '';

            sortedData.forEach(row => {
                const tr = document.createElement('tr');
                const count = parseInt(row[1] || 0);
                const percent = totalVotes > 0 ? Math.round((count / totalVotes) * 100) : 0;
                
                tr.innerHTML = `<td>Stacja ${row[0]}</td><td>${count}</td><td>${percent}%</td>`;
                tbody.appendChild(tr);
            });
        }

        function showStatus(msg, type) {
            const statusDiv = document.getElementById('status-msg');
            statusDiv.innerText = msg;
            statusDiv.className = `alert alert-${type}`;
            statusDiv.style.display = "block";
        }

        // --- SKANER QR ---
        function onScanSuccess(decodedText) {
            if (decodedText.startsWith('station-')) {
                const id = parseInt(decodedText.split('-')[1]);
                if(id >= 1 && id <= 22) registerVote(id);
            }
        }

        if (!localStorage.getItem('user_has_voted')) {
            let scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
            scanner.render(onScanSuccess);
        }
    </script>
</body>
</html>
