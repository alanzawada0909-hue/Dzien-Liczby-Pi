<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Głosowanie Dzień Pi - XX LO</title>
    
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-purple: #6c5ce7;
            --dark-bg: #050a18;
            --glass: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--dark-bg);
            background-image: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: white;
            margin: 0;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .pi-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: -1;
            font-size: 2rem;
            color: rgba(0, 210, 255, 0.05);
        }

        header {
            text-align: center;
            padding: 30px 20px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 2px solid var(--neon-purple);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            font-size: 1.8rem;
            text-shadow: 0 0 10px var(--neon-blue);
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        #reader {
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            border: none !important;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        th {
            background: var(--neon-purple);
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
        }

        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: none;
            animation: fadeIn 0.5s;
        }
        .alert-success { background: rgba(46, 204, 113, 0.3); border: 1px solid #2ecc71; color: #2ecc71; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="pi-bg" id="pi-bg"></div>

    <header>
        <div style="color: var(--neon-blue); font-size: 0.8rem; letter-spacing: 3px; margin-bottom: 5px;">XX LO</div>
        <h1>𝜋 DZIEŃ LICZBY PI 2026 𝜋</h1>
    </header>

    <div class="container">
        <div id="status-msg" class="alert"></div>

        <div class="card">
            <h3 style="margin-top:0; text-align: center;">📷 Zeskanuj kod stacji</h3>
            <div id="reader"></div>
        </div>

        <div class="card">
            <div style="display:flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; color: var(--neon-blue);">
                <span>RANKING NA ŻYWO</span>
                <span id="total-votes-display">Suma głosów: ...</span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>STACJA</th>
                        <th>GŁOSY</th>
                        <th>UDZIAŁ</th>
                    </tr>
                </thead>
                <tbody id="results-body">
                    <tr><td colspan="3" style="text-align:center">Ładowanie wyników...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div style="position:fixed; bottom:10px; right:15px; font-size:1.5rem; opacity:0.8; z-index:100; pointer-events:none;">
        🤶 👳 𝜋
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxEwD-ytntDUxYo0WlvJYl3Ld6p1_6A-3juWwe1q4vKhnvtZq_RzaiqUKUqKVYMMb8/exec";
        
        const bg = document.getElementById('pi-bg');
        for(let i=0; i<30; i++) {
            const pi = document.createElement('div');
            pi.innerText = 'π';
            pi.style.position = 'absolute';
            pi.style.left = Math.random() * 100 + 'vw';
            pi.style.top = Math.random() * 100 + 'vh';
            pi.style.opacity = Math.random() * 0.15;
            bg.appendChild(pi);
        }

        async function fetchResults() {
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getResults`);
                const data = await response.json();
                const tbody = document.getElementById('results-body');
                const totalDisplay = document.getElementById('total-votes-display');
                
                let total = data.reduce((sum, row) => sum + parseInt(row[1] || 0), 0);
                totalDisplay.innerText = `Suma głosów: ${total}`;

                tbody.innerHTML = '';
                data.sort((a,b) => b[1]-a[1]).forEach(row => {
                    const count = parseInt(row[1] || 0);
                    const percent = total > 0 ? Math.round((count/total)*100) : 0;
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>Stacja ${row[0]}</td><td>${count}</td><td>${percent}%</td>`;
                    tbody.appendChild(tr);
                });
            } catch(e) { console.log("Błąd danych"); }
        }

        async function registerVote(id) {
            if(localStorage.getItem('voted')) return;
            document.getElementById('status-msg').style.display = 'block';
            document.getElementById('status-msg').innerText = "⏳ Zapisywanie...";
            document.getElementById('status-msg').className = "alert alert-success";

            try {
                const res = await fetch(`${SCRIPT_URL}?action=vote&id=${id}`);
                if(res.ok) {
                    localStorage.setItem('voted', 'true');
                    document.getElementById('status-msg').innerText = `✅ Głos na stację ${id} oddany!`;
                    fetchResults();
                }
            } catch(e) { alert("Błąd!"); }
        }

        function onScanSuccess(text) {
            if(text.startsWith('station-')) {
                const id = text.split('-')[1];
                html5QrcodeScanner.clear().then(() => registerVote(id));
            }
        }

        let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
        if(!localStorage.getItem('voted')) {
            html5QrcodeScanner.render(onScanSuccess);
        } else {
            document.getElementById('status-msg').style.display = 'block';
            document.getElementById('status-msg').innerText = "✅ Już zagłosowałeś!";
            document.getElementById('status-msg').className = "alert alert-success";
        }

        setInterval(fetchResults, 5000);
        fetchResults();
    </script>
</body>
</html>
